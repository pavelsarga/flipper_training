[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marv_rl_training"
version = "2.0"
description = "Training, evaluation and ROS2 deployment of flipper-control policies for the MARV tracked rover"
requires-python = ">=3.10"
# The runtime environment is the Isaac Lab conda env built by containers/isaaclab.def from
# containers/environment.yml (workspace root); that is where versions are pinned. This list
# names what the package imports so it can be installed into that env in editable mode.
dependencies = [
    "torch",
    "torchrl",
    "tensordict",
    "gymnasium",
    "omegaconf",
    "numpy",
    "scipy",
    "pyyaml",
    "tqdm",
    "rich",
    "matplotlib",
    "wandb",
    "optuna",
    "lovely-tensors",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marv_rl_training*"]

[tool.ruff]
line-length = 150
extend-select = ["E", "F", "Q", "B"]
extend-exclude = ["*.ipynb"]
